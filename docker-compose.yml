services:
  inventory-app:
    build: .
    ports:
      - "8501:8501"
    environment:
      INVENTORY_DATABASE_PATH: /app/persist/inventory.db
    volumes:
      - inventory_data:/app/persist
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  inventory_data:
